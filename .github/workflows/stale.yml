name: Close stale issues and PRs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

  permissions:

  issues: write 
  pull-request: write

jobs:
  stale:
    runs-on:ubuntu-lateststeps:
     - uses: actions/stale@v9
       with:
          before-stale: 7
          days-before-close: 4
          stale-issue-message: 'This issue has been inactive for 7 days and will be closed in 4 days if there is no further activity.'
          stale-pr-message: 'This pull request has been inactive for 7 days and will be closed in 4 days if there is no further activity.'
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          