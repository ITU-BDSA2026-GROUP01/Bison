name: .NET

on:
  push:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ./Bison.sln

      - name: Build
        run: dotnet build ./Bison.sln --no-restore

      - name: Start web server
        working-directory: src/Bison.CSVDBService
        run: |
          nohup dotnet run --launch-profile http > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5195/observations > /dev/null 2>&1; then
              echo "Server is up."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Server failed to start. Log:" >&2
              cat server.log >&2
              exit 1
            fi
            sleep 1
          done

      - name: Test
        run: dotnet test ./Bison.sln --no-build -m:1

      - name: Stop web server
        working-directory: src/Bison.CSVDBService
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill "$(cat server.pid)" 2>/dev/null || true
          fi
          pkill -f Bison.CSVDBService 2>/dev/null || true
