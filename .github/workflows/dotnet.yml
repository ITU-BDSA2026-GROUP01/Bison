name: .NET

on:
  push:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Dafny
        uses: dafny-lang/setup-dafny-action@v1
        with:
          dafny-version: "4.11.0"

      - name: Verify and compile Dafny code to C#
        run: dafny translate cs --include-runtime ObservationFilter.dfy
        working-directory: src/Bison.Razor/verification

      - name: Restore
        run: dotnet restore ./Bison.sln

      - name: Build
        run: dotnet build ./Bison.sln --no-restore

      - name: Test
        run: dotnet test ./Bison.sln --no-build -m:1